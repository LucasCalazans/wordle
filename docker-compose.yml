services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: wordle-dev:latest
    container_name: wordle-dev
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - wordle_node_modules:/workspace/node_modules
    ports:
      - "8081:8081"      # Metro bundler
      - "19000:19000"    # Expo dev server
      - "19001:19001"
      - "19002:19002"
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: "0.0.0.0"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      HOME: /tmp
    stdin_open: true
    tty: true
    command: bash

  install:
    extends:
      service: dev
    container_name: wordle-install
    ports: []
    stdin_open: false
    tty: false
    command: npm install

  test:
    extends:
      service: dev
    container_name: wordle-test
    ports: []
    stdin_open: false
    tty: false
    command: npm test

  typecheck:
    extends:
      service: dev
    container_name: wordle-typecheck
    ports: []
    stdin_open: false
    tty: false
    command: npm run typecheck

volumes:
  wordle_node_modules:
    name: wordle_node_modules
